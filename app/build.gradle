plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahmedaraby.archive'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahmedaraby.archive'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '6.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
